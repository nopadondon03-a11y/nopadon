<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard วิเคราะห์ NCP รายบุคคล</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-7xl mx-auto">
        <h1 class="text-3xl font-bold mb-8 text-gray-800">สรุปการวิเคราะห์ NCP แยกรายบุคคล</h1>
        
        <!-- ตัวกรองข้อมูล -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 mb-8 grid grid-cols-1 md:grid-cols-4 gap-4">
            <div>
                <label class="block text-sm font-bold text-gray-700">จากวันที่</label>
                <input type="date" id="filter-date-start" class="mt-1 block w-full border rounded-md p-2">
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700">ถึงวันที่</label>
                <input type="date" id="filter-date-end" class="mt-1 block w-full border rounded-md p-2">
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700">เครื่องจักร</label>
                <select id="filter-machine" class="mt-1 block w-full border rounded-md p-2"><option value="all">ทั้งหมด</option></select>
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700">กะ</label>
                <select id="filter-shift" class="mt-1 block w-full border rounded-md p-2"><option value="all">ทั้งหมด</option></select>
            </div>
        </div>

        <!-- ส่วนแสดงกราฟเส้น พร้อมปุ่มสลับมุมมอง Daily / Weekly / Monthly -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 mb-8">
            <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                <h2 class="text-xl font-bold text-gray-800">📈 แนวโน้มจำนวนครั้งที่เกิน 2 พาเลทรายบุคคล</h2>
                <!-- ปุ่มสลับมุมมองสไตล์โมเดิร์น -->
                <div class="flex bg-gray-100 p-1 rounded-xl shadow-inner">
                    <button onclick="setChartView('daily')" id="btn-daily" class="px-5 py-2 text-sm font-semibold rounded-lg transition-all duration-200 bg-indigo-600 text-white shadow-sm">Daily</button>
                    <button onclick="setChartView('weekly')" id="btn-weekly" class="px-5 py-2 text-sm font-semibold rounded-lg transition-all duration-200 text-gray-600 hover:text-gray-900">Weekly</button>
                    <button onclick="setChartView('monthly')" id="btn-monthly" class="px-5 py-2 text-sm font-semibold rounded-lg transition-all duration-200 text-gray-600 hover:text-gray-900">Monthly</button>
                </div>
            </div>
            <div class="relative h-96 w-full">
                <canvas id="overChart"></canvas>
            </div>
        </div>

        <!-- การ์ดรายบุคคล -->
        <div id="blocks-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

    <script>
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSJLOKv2HXPLKnHoo3hc57LkyR4UIMbSsxQQb6BrCnqJplzbtJKc6Hhj7vx8_hYABvBMN4i8zNvcY0A/pub?gid=0&single=true&output=csv';
        let rawData = [];
        let chartInstance = null;
        let currentViewMode = 'daily'; // ค่าเริ่มต้นเป็นแบบรายวัน

        // ดัชนีคอลัมน์: Name(AI)=34, AM=38, Problem(U)=20, Total(I)=8, NCP(P)=15, PDR(C)=2, Date(AB)=27, Machine(G)=6, Shift(B)=1
        const NAME_IDX = 34, AM_IDX = 38, PROB_IDX = 20, TOTAL_IDX = 8, NCP_IDX = 15, PDR_IDX = 2, DATE_IDX = 27, MACHINE_IDX = 6, SHIFT_IDX = 1;

        async function init() {
            try {
                const response = await fetch(sheetUrl);
                const csvText = await response.text();
                Papa.parse(csvText, {
                    header: false, skipEmptyLines: true,
                    complete: (res) => {
                        rawData = res.data.slice(1);
                        initFilters();
                        renderDashboard();
                    }
                });
            } catch (err) {
                console.error("ไม่สามารถโหลดข้อมูลได้", err);
            }
        }

        function initFilters() {
            const machines = [...new Set(rawData.map(r => r[MACHINE_IDX]))].filter(x => x).sort();
            const shifts = [...new Set(rawData.map(r => r[SHIFT_IDX]))].filter(x => x).sort();
            machines.forEach(m => document.getElementById('filter-machine').innerHTML += `<option value="${m}">${m}</option>`);
            shifts.forEach(s => document.getElementById('filter-shift').innerHTML += `<option value="${s}">${s}</option>`);
        }

        function toggleDetails(id) {
            const el = document.getElementById(id);
            el.style.display = (el.style.display === "none") ? "block" : "none";
        }

        function parseDateToStandard(dateStr) {
            if (!dateStr) return '';
            dateStr = dateStr.trim();
            if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return dateStr;
            
            const parts = dateStr.split(/[\/\-]/);
            if (parts.length === 3) {
                let d = parts[0], m = parts[1], y = parts[2];
                if (y.length === 2) y = '20' + y;
                if (y.length === 4 && m.length <= 2 && d.length <= 2) {
                    return `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
                }
            }
            const parsed = new Date(dateStr);
            if (!isNaN(parsed.getTime())) {
                const y = parsed.getFullYear();
                const m = String(parsed.getMonth() + 1).padStart(2, '0');
                const d = String(parsed.getDate()).padStart(2, '0');
                return `${y}-${m}-${d}`;
            }
            return dateStr;
        }

        function cleanPercent(valStr) {
            if (!valStr) return NaN;
            const cleaned = String(valStr).replace(/%/g, '').trim();
            return parseFloat(cleaned);
        }

        function setChartView(mode) {
            currentViewMode = mode;
            ['daily', 'weekly', 'monthly'].forEach(m => {
                const btn = document.getElementById(`btn-${m}`);
                if (m === mode) {
                    btn.className = "px-5 py-2 text-sm font-semibold rounded-lg transition-all duration-200 bg-indigo-600 text-white shadow-sm";
                } else {
                    btn.className = "px-5 py-2 text-sm font-semibold rounded-lg transition-all duration-200 text-gray-600 hover:text-gray-900";
                }
            });
            renderDashboard();
        }

        function getWeekNumber(d) {
            d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
            var yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
            var weekNo = Math.ceil(( ( (d - yearStart) / 86400000) + 1)/7);
            return `${d.getUTCFullYear()}-W${String(weekNo).padStart(2, '0')}`;
        }

        function renderDashboard() {
            const container = document.getElementById('blocks-container');
            container.innerHTML = '';
            
            const fStart = document.getElementById('filter-date-start').value;
            const fEnd = document.getElementById('filter-date-end').value;
            const fMach = document.getElementById('filter-machine').value;
            const fShift = document.getElementById('filter-shift').value;

            const filtered = rawData.filter(r => {
                const rowDate = parseDateToStandard(r[DATE_IDX]);
                const matchDate = (!fStart || rowDate >= fStart) && (!fEnd || rowDate <= fEnd);
                const matchMach = (fMach === 'all' || r[MACHINE_IDX] === fMach);
                const matchShift = (fShift === 'all' || r[SHIFT_IDX] === fShift);
                return matchDate && matchMach && matchShift;
            });

            const grouped = filtered.reduce((acc, row) => {
                const name = row[NAME_IDX] || 'ไม่ระบุชื่อ';
                if (!acc[name]) acc[name] = { over: [], under: [] };
                const val = parseFloat(row[AM_IDX]);
                if (!isNaN(val)) {
                    val > 2 ? acc[name].over.push(row) : acc[name].under.push(row);
                }
                return acc;
            }, {});

            // เตรียมข้อมูลสำหรับกราฟเส้น
            let timeLabelsSet = new Set();
            filtered.forEach(row => {
                const val = parseFloat(row[AM_IDX]);
                if (!isNaN(val) && val > 2) {
                    const standardDate = parseDateToStandard(row[DATE_IDX]);
                    if (currentViewMode === 'daily') {
                        timeLabelsSet.add(standardDate || 'ไม่ระบุวันที่');
                    } else if (currentViewMode === 'weekly') {
                        const dObj = standardDate ? new Date(standardDate) : null;
                        timeLabelsSet.add(dObj && !isNaN(dObj) ? getWeekNumber(dObj) : 'ไม่ระบุสัปดาห์');
                    } else {
                        timeLabelsSet.add(standardDate ? standardDate.substring(0, 7) : 'ไม่ระบุเดือน');
                    }
                }
            });

            const chartLabels = Array.from(timeLabelsSet).sort();
            
            // รวบรวมรายชื่อบุคคลทั้งหมดที่ผ่านการกรองและมีค่า > 50%
            const personNames = Object.keys(grouped).filter(name => grouped[name].over.length > 0);
            
            const colorPalette = [
                'rgb(99, 102, 241)', 'rgb(239, 68, 68)', 'rgb(16, 185, 129)', 
                'rgb(245, 158, 11)', 'rgb(139, 92, 246)', 'rgb(236, 72, 153)', 
                'rgb(14, 165, 233)', 'rgb(234, 179, 8)'
            ];

            const datasets = personNames.map((name, idx) => {
                const color = colorPalette[idx % colorPalette.length];
                const dataCounts = chartLabels.map(label => {
                    return grouped[name].over.filter(r => {
                        const standardDate = parseDateToStandard(r[DATE_IDX]);
                        let key = '';
                        if (currentViewMode === 'daily') {
                            key = standardDate || 'ไม่ระบุวันที่';
                        } else if (currentViewMode === 'weekly') {
                            const dObj = standardDate ? new Date(standardDate) : null;
                            key = dObj && !isNaN(dObj) ? getWeekNumber(dObj) : 'ไม่ระบุสัปดาห์';
                        } else {
                            key = standardDate ? standardDate.substring(0, 7) : 'ไม่ระบุเดือน';
                        }
                        return key === label;
                    }).length;
                });

                return {
                    label: name,
                    data: dataCounts,
                    borderColor: color,
                    backgroundColor: color,
                    borderWidth: 2,
                    pointRadius: 4,
                    tension: 0.2
                };
            });

            Object.entries(grouped).forEach(([name, g], index) => {
                const idOver = `o-${index}`, idUnder = `u-${index}`;
                const block = document.createElement('div');
                block.className = "bg-white p-6 rounded-2xl shadow-md border border-gray-200 flex flex-col justify-between";
                
                const renderItems = (list) => list.map(r => {
                    return `<li class="border-b pb-1 mb-1 border-gray-100">
                        • <b>PDR:</b> ${r[PDR_IDX] || '-'} | <b>เครื่องจักร:</b> ${r[MACHINE_IDX] || '-'}<br>
                        <b>ปัญหา:</b> ${r[PROB_IDX] || '-'}<br>
                        <span class="text-gray-500 text-[11px]">ผลิต: ${r[TOTAL_IDX] || 0} | NCP: ${r[NCP_IDX] || 0} | <b>ค่า: ${r[AM_IDX] || 0} พาเลท</b></span>
                    </li>`;
                }).join('');

                block.innerHTML = `
                    <div>
                        <h2 class="text-xl font-bold text-gray-800 mb-4 border-b pb-2">${name}</h2>
                        <div class="mb-4">
                            <button onclick="toggleDetails('${idOver}')" class="text-red-600 font-bold w-full text-left bg-red-50 p-2 rounded hover:bg-red-100 transition">⚠️ เกิน 2 พาเลท: ${g.over.length} รายการ</button>
                            <ul id="${idOver}" style="display:none" class="text-xs text-gray-600 mt-2 space-y-2 bg-red-50 p-3 rounded max-h-48 overflow-y-auto">
                                ${g.over.length > 0 ? renderItems(g.over) : '<li>ไม่มีข้อมูล</li>'}
                            </ul>
                        </div>
                        <div>
                            <button onclick="toggleDetails('${idUnder}')" class="text-green-600 font-bold w-full text-left bg-green-50 p-2 rounded hover:bg-green-100 transition">✅ ปกติ: ${g.under.length} รายการ</button>
                            <ul id="${idUnder}" style="display:none" class="text-xs text-gray-600 mt-2 space-y-2 bg-green-50 p-3 rounded max-h-48 overflow-y-auto">
                                ${g.under.length > 0 ? renderItems(g.under) : '<li>ไม่มีข้อมูล</li>'}
                            </ul>
                        </div>
                    </div>
                `;
                container.appendChild(block);
            });

            updateChart(chartLabels, datasets);
        }

        function updateChart(labels, datasets) {
            const ctx = document.getElementById('overChart').getContext('2d');
            if (chartInstance) {
                chartInstance.destroy();
            }
            
            Chart.register(ChartDataLabels);

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { stepSize: 1 },
                            grace: '20%'
                        }
                    },
                    plugins: {
                        legend: { position: 'top' },
                        datalabels: {
                            align: 'top',
                            anchor: 'end',
                            color: '#1f2937',
                            font: {
                                weight: 'bold',
                                size: 10
                            },
                            formatter: (value) => value > 0 ? value : ''
                        }
                    }
                }
            });
        }

        ['filter-date-start', 'filter-date-end', 'filter-machine', 'filter-shift'].forEach(id => {
            document.getElementById(id).addEventListener('change', renderDashboard);
        });

        init();
    </script>
</body>
</html>
